version: "1.7"
vertical: physio

# ── Branding ──────────────────────────────────────────────────────────────────

branding:
  nombre: "FisioNova"
  nombre_visible: "FisioNova · Clínica de Fisioterapia"
  tagline: "Muévete mejor, vive sin dolor"
  tagline_largo: "Fisioterapia deportiva, rehabilitación y terapia manual para recuperarte y rendir al máximo"
  primaryColor: "#4338ca"
  secondaryColor: "#059669"
  accentColor: "#7c3aed"
  bgColor: "#eef2ff"
  favicon: null
  logo: null
  dominio: "fisionova-demo.local"

# ── V1.7: Experience config ───────────────────────────────────────────────────

experience:
  preset: calm
  motion: low
  transitions: true
  scrollEffects:
    - fade-in
    - slide-up
    - stagger-reveal
    - counter-on-visible
    - progress-on-scroll
  interactions:
    - card-hover-elevation
    - animated-metrics
    - expandable-cards
    - before-after-slider
    - interactive-timeline
    - animated-progress
    - interactive-calendar
    - tooltips
    - cta-feedback
    - animated-counters
  animatedMetrics: true
  reducedMotion: auto

# ── V1.7: Video config ────────────────────────────────────────────────────────

video:
  autoplay: false
  muted: true
  mobileEnabled: false
  lazyLoad: true
  hero:
    autoplay: false
    controls: true
    preload: metadata
    poster: null
  services:
    autoplay: false
    controls: true
    preload: metadata
  exercises:
    autoplay: false
    controls: true
    loop: false
  explainer:
    autoplay: false
    controls: true
    preload: metadata
  ambient:
    autoplay: false
    muted: true
    mobileEnabled: false

# ── V1.7: Secciones dinámicas ─────────────────────────────────────────────────

dynamicSections:
  - type: metric-row
    trigger: on-view
    behavior: animate-count
  - type: before-after
    trigger: on-view
    behavior: drag-to-reveal
  - type: timeline
    trigger: on-scroll
    behavior: stagger-reveal
  - type: filterable-grid
    trigger: on-interaction
    behavior: filter-fade
  - type: testimonials
    trigger: on-view
    behavior: stagger-reveal
  - type: faq-accordion
    trigger: immediate
    behavior: expand-on-click

