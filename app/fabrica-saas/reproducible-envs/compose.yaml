# compose.yaml — ADV-15 reproducible environment foundation
# FACTORY_AGENCY_SCOPE_ONLY=SI | NO_REAL_SECRETS=SI | NO_REAL_PRODUCTION_DEPLOY=SI
# Port 5175 is reserved — use 5180 or configure via PORT env

name: factory-saas-env

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22"
    image: factory-app:local
    ports:
      - "${PORT:-5180}:${PORT:-5180}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-5180}
    env_file:
      - .env.runtime
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-5180}/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: npm test
    environment:
      - NODE_ENV=test
    profiles:
      - test

  qa:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: npm run build
    environment:
      - NODE_ENV=test
    profiles:
      - qa
