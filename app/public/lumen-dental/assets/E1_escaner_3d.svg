<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F9FF"/>
      <stop offset="100%" style="stop-color:#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Device body -->
  <rect x="250" y="150" width="300" height="240" rx="24" fill="white" stroke="#0369A1" stroke-width="3" filter="drop-shadow(0 8px 24px rgba(3,105,161,0.2))"/>
  <!-- Scanner head -->
  <rect x="290" y="190" width="220" height="40" rx="8" fill="#0369A1" opacity="0.15"/>
  <rect x="310" y="200" width="180" height="20" rx="6" fill="#0369A1"/>
  <!-- Scan lines -->
  <line x1="290" y1="260" x2="510" y2="260" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <line x1="290" y1="280" x2="510" y2="280" stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4"/>
  <line x1="290" y1="300" x2="510" y2="300" stroke="#0EA5E9" stroke-width="1" stroke-dasharray="8,4" opacity="0.3"/>
  <!-- Accent glow -->
  <rect x="270" y="340" width="260" height="10" rx="5" fill="url(#bg)" opacity="0.5"/>
  <circle cx="400" cy="460" r="4" fill="#0369A1"/>
  <text x="400" y="555" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#0369A1" text-anchor="middle">Escáner Intraoral 3D · Lumen Dental</text>
  <text x="400" y="575" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">E1 · Demo</text>
</svg>
