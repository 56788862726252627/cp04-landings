<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F9FF"/>
      <stop offset="100%" style="stop-color:#BAE6FD"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <!-- Clinical backdrop elements -->
  <rect x="50" y="50" width="800" height="500" rx="20" fill="rgba(255,255,255,0.5)" stroke="#E0F2FE" stroke-width="2"/>
  <rect x="80" y="80" width="740" height="440" rx="16" fill="rgba(255,255,255,0.3)"/>
  <!-- Screen simulation -->
  <rect x="500" y="120" width="280" height="180" rx="12" fill="rgba(3,105,161,0.08)" stroke="#0369A1" stroke-width="2"/>
  <text x="640" y="200" font-family="Inter,sans-serif" font-size="11" fill="#0369A1" text-anchor="middle" opacity="0.7">Diagnóstico Digital</text>
  <!-- Tooth xray lines -->
  <rect x="510" y="215" width="260" height="70" rx="8" fill="rgba(3,105,161,0.05)" stroke="#0EA5E9" stroke-width="1"/>
  <text x="640" y="255" font-family="Inter,sans-serif" font-size="10" fill="#0369A1" text-anchor="middle" opacity="0.6">Ortopantomografía · Demo</text>
  <!-- Figures (abstract) -->
  <!-- Doctor -->
  <circle cx="280" cy="200" r="40" fill="#0369A1" opacity="0.15"/>
  <circle cx="280" cy="180" r="25" fill="#0369A1" opacity="0.2"/>
  <rect x="240" y="220" width="80" height="100" rx="20" fill="#0369A1" opacity="0.12"/>
  <!-- Patient -->
  <circle cx="420" cy="230" r="35" fill="#0EA5E9" opacity="0.12"/>
  <circle cx="420" cy="215" r="22" fill="#0EA5E9" opacity="0.15"/>
  <rect x="380" y="248" width="80" height="90" rx="16" fill="#0EA5E9" opacity="0.1"/>
  <!-- Accent -->
  <circle cx="200" cy="420" r="60" fill="rgba(245,158,11,0.08)"/>
  <text x="450" y="580" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">A2 · Consulta Odontóloga · Lumen Dental</text>
</svg>
