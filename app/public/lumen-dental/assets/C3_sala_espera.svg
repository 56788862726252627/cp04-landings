<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF7ED"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Floor -->
  <rect x="0" y="560" width="1200" height="240" fill="rgba(255,255,255,0.4)"/>
  <!-- Furniture silhouettes -->
  <rect x="200" y="350" width="800" height="210" rx="20" fill="rgba(255,255,255,0.6)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="350" y="280" width="500" height="80" rx="10" fill="rgba(255,255,255,0.5)"/>
  <!-- Accent circles -->
  <circle cx="180" cy="480" r="80" fill="#F59E0B" opacity="0.12"/>
  <circle cx="1020" cy="480" r="60" fill="#F59E0B" opacity="0.1"/>
  <!-- Label -->
  <rect x="400" y="680" width="400" height="50" rx="25" fill="#F59E0B" opacity="0.15"/>
  <text x="600" y="712" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="600" fill="#b45309" text-anchor="middle">Sala de Espera · Lumen Dental</text>
  <text x="600" y="778" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(0,0,0,0.3)" text-anchor="middle">Demo</text>
