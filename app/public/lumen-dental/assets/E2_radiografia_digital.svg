<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1426"/>
      <stop offset="100%" style="stop-color:#071524"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#0B1426"/>
  <!-- Monitor frame -->
  <rect x="60" y="50" width="680" height="440" rx="12" fill="#111827" stroke="#1E3A5F" stroke-width="3"/>
  <!-- Screen -->
  <rect x="80" y="70" width="640" height="400" rx="8" fill="url(#screen)"/>
  <!-- X-ray representation -->
  <g opacity="0.85">
    <!-- Panoramic dental xray - abstract -->
    <ellipse cx="400" cy="270" rx="260" ry="90" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.4"/>
    <!-- Upper teeth outlines -->
    <g opacity="0.7">
      <rect x="160" y="200" width="22" height="40" rx="6" fill="#93C5FD" opacity="0.5"/>
      <rect x="188" y="195" width="20" height="45" rx="6" fill="#93C5FD" opacity="0.6"/>
      <rect x="212" y="190" width="22" height="50" rx="6" fill="#93C5FD" opacity="0.65"/>
      <rect x="238" y="188" width="20" height="52" rx="6" fill="#BFDBFE" opacity="0.7"/>
      <rect x="262" y="186" width="20" height="54" rx="6" fill="#BFDBFE" opacity="0.75"/>
      <rect x="286" y="185" width="22" height="55" rx="6" fill="#BFDBFE" opacity="0.8"/>
      <rect x="312" y="184" width="22" height="56" rx="6" fill="#E0F2FE" opacity="0.8"/>
      <rect x="338" y="184" width="22" height="56" rx="6" fill="#FFFFFF" opacity="0.85"/>
      <rect x="364" y="184" width="22" height="56" rx="6" fill="#FFFFFF" opacity="0.85"/>
      <rect x="390" y="184" width="22" height="56" rx="6" fill="#E0F2FE" opacity="0.8"/>
      <rect x="416" y="185" width="22" height="55" rx="6" fill="#BFDBFE" opacity="0.8"/>
      <rect x="442" y="186" width="20" height="54" rx="6" fill="#BFDBFE" opacity="0.75"/>
      <rect x="466" y="188" width="20" height="52" rx="6" fill="#93C5FD" opacity="0.7"/>
      <rect x="490" y="190" width="22" height="50" rx="6" fill="#93C5FD" opacity="0.65"/>
      <rect x="516" y="195" width="20" height="45" rx="6" fill="#93C5FD" opacity="0.6"/>
      <rect x="540" y="200" width="22" height="40" rx="6" fill="#93C5FD" opacity="0.5"/>
    </g>
    <!-- Lower teeth outlines -->
    <g opacity="0.65">
      <rect x="170" y="265" width="20" height="38" rx="6" fill="#7DD3FC" opacity="0.5"/>
      <rect x="196" y="262" width="20" height="42" rx="6" fill="#7DD3FC" opacity="0.55"/>
      <rect x="222" y="258" width="22" height="46" rx="6" fill="#93C5FD" opacity="0.6"/>
      <rect x="250" y="255" width="22" height="50" rx="6" fill="#BFDBFE" opacity="0.65"/>
      <rect x="276" y="253" width="22" height="52" rx="6" fill="#BFDBFE" opacity="0.7"/>
      <rect x="302" y="252" width="22" height="53" rx="6" fill="#DBEAFE" opacity="0.75"/>
      <rect x="328" y="251" width="22" height="54" rx="6" fill="#EFF6FF" opacity="0.8"/>
      <rect x="354" y="251" width="22" height="54" rx="6" fill="#FFFFFF" opacity="0.8"/>
      <rect x="380" y="251" width="22" height="54" rx="6" fill="#FFFFFF" opacity="0.8"/>
      <rect x="406" y="252" width="22" height="53" rx="6" fill="#DBEAFE" opacity="0.75"/>
      <rect x="432" y="253" width="22" height="52" rx="6" fill="#BFDBFE" opacity="0.7"/>
      <rect x="458" y="255" width="22" height="50" rx="6" fill="#BFDBFE" opacity="0.65"/>
      <rect x="484" y="258" width="22" height="46" rx="6" fill="#93C5FD" opacity="0.6"/>
      <rect x="510" y="262" width="20" height="42" rx="6" fill="#7DD3FC" opacity="0.55"/>
      <rect x="534" y="265" width="20" height="38" rx="6" fill="#7DD3FC" opacity="0.5"/>
    </g>
    <!-- Measurement annotations -->
    <text x="680" y="130" font-family="mono,monospace" font-size="9" fill="#0EA5E9" opacity="0.6">Rx 0.1mSv</text>
    <text x="680" y="145" font-family="mono,monospace" font-size="9" fill="#0EA5E9" opacity="0.6">Full Arch</text>
    <text x="680" y="160" font-family="mono,monospace" font-size="9" fill="#10B981" opacity="0.6">OK</text>
  </g>
  <!-- Monitor stand -->
  <rect x="370" y="490" width="60" height="40" fill="#111827"/>
  <rect x="300" y="525" width="200" height="20" rx="6" fill="#111827" stroke="#1E3A5F"/>
  <text x="400" y="575" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.3)" text-anchor="middle">E2 · Radiografía Digital · Lumen Dental · Demo</text>
