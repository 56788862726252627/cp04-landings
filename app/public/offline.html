<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080d" />
    <title>Sin conexión · Club Pádel 04</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: radial-gradient(circle at 20% 0%, rgba(182,255,0,.12), transparent 30%), linear-gradient(145deg, #05080d 0%, #08111f 48%, #05080d 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
        letter-spacing: -0.02em;
      }
      p {
        color: #9aa8bd;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 15px;
        padding: 12px 24px;
        min-height: 44px;
        font-weight: 900;
        font-size: 1rem;
        cursor: pointer;
        background: linear-gradient(135deg, #b6ff00, #20e3b2);
        color: #06100a;
      }
      button:focus-visible {
        outline: 3px solid rgba(182,255,0,.9);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No se puede cargar Club Pádel 04 porque no hay conexión a internet y esta página todavía no está disponible sin conexión. Comprueba tu red e inténtalo de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
